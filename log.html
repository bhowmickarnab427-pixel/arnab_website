<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">

        <!-- Login Page -->
        <section id="loginPage" class="form-box">
            <h1>Welcome Back</h1>
            <p class="subtitle">Login to your account</p>

            <form id="loginForm">
                <label for="loginUsername">Username</label>
                <input type="text" id="loginUsername"
                       placeholder="Enter username" required>

                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword"
                       placeholder="Enter password" required>

                <button type="submit">Login</button>
            </form>

            <p id="loginMessage" class="message"></p>
            <button type="button" id="forgotPasswordButton"
                    class="text-button">Forgot Password?</button>

            <p class="bottom-text">
                Don't have an account?
                <button type="button" id="signupButton"
                        class="text-button">Sign Up</button>
            </p>

            <p class="developer">Developed by Arnab Bhowmick</p>
        </section>

        <!-- Sign Up Page -->
        <section id="signupPage" class="form-box hidden">
            <h1>Create Account</h1>
            <p class="subtitle">Join us today</p>

            <form id="signupForm">
                <label for="signupUsername">Username</label>
                <input type="text" id="signupUsername"
                       placeholder="Create username" required>

                <label for="signupPassword">Password</label>
                <input type="password" id="signupPassword"
                       placeholder="Create password" required>

                <button type="submit">Create Account</button>
            </form>

            <p id="signupMessage" class="message"></p>

            <button type="button" id="backButton"
                    class="text-button">Back to Login</button>

            <p class="developer">Developed by Arnab Bhowmick</p>
        </section>

        <!-- Welcome Page -->
        <section id="namePage" class="welcome-page hidden">
            <h1 id="displayName">Hi!</h1>
            <h2 id="displayName2">Login Successful!</h2>
            <p id="displayName3">Welcome</p>

            <!-- Live Clock and Date -->
            <div class="live-clock-box">
                <h3>Live Clock</h3>
                <p id="liveClock">00:00:00</p>
                <p id="liveDate">Loading date...</p>
            </div>
            <div id="currentLocation">
    Getting your location...
</div>

            <!-- Message Box -->
            <div class="message-box">
                <h3>Send a Message</h3>
                <form id="messageForm">
                    <textarea id="userMessage"
                              placeholder="Write your message here..."
                              rows="4" required></textarea>

                    <button type="submit" id="sendMessageButton">
                        Send Message
                    </button>
                </form>

                <p id="messageStatus" class="message"></p>
            </div>

            <button type="button" id="logoutButton"
                    class="logout-button">Logout</button>

            <p class="developer">Developed by Arnab Bhowmick</p>
        </section>

        <!-- Notification -->
        <div id="notification" class="notification"
             role="status" aria-live="polite"></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
